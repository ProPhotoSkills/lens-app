<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>PPS Lens – offline</title>
<style>
  body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: #ebebeb; font: 16px/1.5 system-ui, -apple-system, "Segoe UI", sans-serif; color: #1c1917; }
  .karte { max-width: 24rem; margin: 1.5rem; padding: 2rem; background: #fff; border-radius: 1rem; box-shadow: 0 10px 30px rgba(0,0,0,.12); text-align: center; }
  img { width: 72px; height: 72px; }
  h1 { font-size: 1.25rem; margin: .75rem 0 .5rem; }
  p { color: #57534e; margin: 0 0 1.25rem; }
  button { background: #292524; color: #fff; border: 0; border-radius: .5rem; padding: .6rem 1.2rem; font: inherit; font-weight: 600; cursor: pointer; }
</style>
</head>
<body>
  <div class="karte">
    <img src="/icon-192.png" alt="">
    <h1>Keine Internetverbindung</h1>
    <p>PPS Lens braucht Internet, um Fotos zu bewerten. Bitte prüfe deine Verbindung.<br><span style="font-size:.9em">No internet connection – PPS Lens needs to be online.</span></p>
    <button onclick="location.reload()">Nochmal versuchen</button>
  </div>
</body>
</html>
